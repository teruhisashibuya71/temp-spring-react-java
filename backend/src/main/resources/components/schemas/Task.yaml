type: object
properties:
  id:
    type: integer
    format: int64
    description: タスクID
  title:
    type: string
    maxLength: 255
    description: タスクタイトル
  description:
    type: string
    nullable: true
    description: タスク説明
  status:
    type: string
    enum:
      - TODO
      - IN_PROGRESS
      - DONE
    description: ステータス
  createdAt:
    type: string
    format: date-time
    description: 作成日時
  updatedAt:
    type: string
    format: date-time
    description: 更新日時
required:
  - id
  - title
  - status
  - createdAt
  - updatedAt
