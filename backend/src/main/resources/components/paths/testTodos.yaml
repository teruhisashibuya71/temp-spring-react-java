getTestTodos:
  get:
    operationId: getTestTodoList
    summary: テスト用タスクのリストを取得します
    description: テスト用タスクのリストを取得します
    tags:
      - TestTodos
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/TestTodo.yaml'
      '500':
        description: サーバーエラー
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'